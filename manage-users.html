<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS – Manage Users</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .management-container {
        min-height: 100vh;
        padding-top: 120px;
        padding-left: 5%;
        padding-right: 5%;
        padding-bottom: 5rem;
      }

      .user-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 2rem;
      }

      .user-table th,
      .user-table td {
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.8rem 1rem;
        text-align: left;
      }

      .user-table th {
        background: rgba(0, 255, 255, 0.1);
      }

      .user-table tbody tr:hover {
        background: rgba(0, 255, 255, 0.05);
      }

      .delete-btn {
        background: transparent;
        border: 1px solid #ff6b6b;
        color: #ff6b6b;
        padding: 0.3rem 0.6rem;
        border-radius: 4px;
        cursor: pointer;
      }

      .delete-btn:hover {
        background: #ff6b6b;
        color: #000;
      }

      .add-form {
        max-width: 500px;
      }

      .add-form .form-group {
        margin-bottom: 1.2rem;
      }

      .add-form label {
        display: block;
        margin-bottom: 0.5rem;
        color: #00f2fe;
      }

      .add-form input,
      .add-form select {
        width: 100%;
        padding: 0.6rem 1rem;
        border: 1px solid rgba(0, 255, 255, 0.3);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #e5e7eb;
      }

      .add-form button {
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        background: #00f2fe;
        border: none;
        border-radius: 6px;
        color: #000;
        cursor: pointer;
      }

      .add-form button:hover {
        background: #4facfe;
      }
    </style>
  </head>

  <body>
    <nav class="admin-nav">
      <div class="nav-brand">NEXUS</div>
      <div class="nav-links">
        <a href="admin.html">Dashboard</a>
        <button onclick="logout()">Logout</button>
      </div>
    </nav>

    <section class="management-container">
      <h2>Manage Users</h2>

      <table class="user-table" id="userTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- rows will be generated by JS -->
        </tbody>
      </table>

      <form class="add-form" id="addUserForm">
        <h3>Add New User</h3>
        <div class="form-group">
          <label for="new-name">Name</label>
          <input type="text" id="new-name" required />
        </div>
        <div class="form-group">
          <label for="new-email">Email</label>
          <input type="email" id="new-email" required />
        </div>
        <div class="form-group">
          <label for="new-role">Role</label>
          <select id="new-role">
            <option value="user">user</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <button type="submit">Add User</button>
      </form>
    </section>

    <script src="script.js"></script>
    <script>
      // sample data to display
      let users = [
        { id: 1, name: "Ana", email: "ana@email.com", role: "user" },
        { id: 2, name: "Juan", email: "juan@email.com", role: "user" },
      ];

      function renderTable() {
        const tbody = document.querySelector("#userTable tbody");
        tbody.innerHTML = "";
        users.forEach((u, idx) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td><button class="delete-btn" data-index="${idx}">Delete</button></td>
          `;
          tbody.appendChild(tr);
        });
      }

      function addUser(e) {
        e.preventDefault();
        const name = document.getElementById("new-name").value.trim();
        const email = document.getElementById("new-email").value.trim();
        const role = document.getElementById("new-role").value;
        if (!name || !email) return;
        const id = users.length ? users[users.length - 1].id + 1 : 1;
        users.push({ id, name, email, role });
        renderTable();
        e.target.reset();
      }

      function deleteHandler(e) {
        if (e.target.matches(".delete-btn")) {
          const idx = parseInt(e.target.getAttribute("data-index"), 10);
          users.splice(idx, 1);
          renderTable();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderTable();
        document
          .getElementById("addUserForm")
          .addEventListener("submit", addUser);
        document
          .querySelector("#userTable tbody")
          .addEventListener("click", deleteHandler);
      });
    </script>
  </body>
</html>
