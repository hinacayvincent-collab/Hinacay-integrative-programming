<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Items</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #e5e7eb;
        min-height: 100vh;
        background: #0f2027;
        margin: 0;
      }
      .saved-page {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      .saved-card {
        max-width: 700px;
        width: 100%;
        background: rgba(7, 23, 45, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 20px;
        box-shadow: 0 0 24px rgba(0, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        padding: 1.8rem;
      }
      .saved-card h1 {
        margin-bottom: 0.5rem;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        color: #00e5ff;
        text-align: center;
      }
      .saved-card p.subtitle {
        text-align: center;
        margin-bottom: 1.8rem;
        color: #94a3b8;
      }
      .home-link {
        display: inline-block;
        margin-bottom: 1rem;
        color: #67e8f9;
        text-decoration: none;
        border: 1px solid #67e8f9;
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
      }
      .home-link:hover {
        background: rgba(103, 232, 249, 0.15);
      }
      .saved-controls {
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .saved-controls span {
        color: #38bdf8;
        font-weight: 600;
      }
      .saved-controls button {
        border: 1px solid #f59e0b;
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
        border-radius: 10px;
        cursor: pointer;
        padding: 0.5rem 0.8rem;
      }
      .saved-controls button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .message {
        margin-top: 0.75rem;
        margin-bottom: 0.75rem;
        color: #d1fae5;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.4);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
      }
      .saved-items {
        display: grid;
        gap: 1rem;
      }
      .saved-item {
        background: rgba(15, 32, 39, 0.85);
        border: 1px solid rgba(2, 132, 199, 0.45);
        border-radius: 12px;
        padding: 0.75rem;
        display: grid;
        grid-template-columns: 80px 1fr auto;
        gap: 0.7rem;
        align-items: start;
        font-size: 0.9rem;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }
      .saved-item:hover {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        background: rgba(20, 44, 62, 0.95);
      }
      .saved-item img {
        width: 80px;
        height: 55px;
        object-fit: cover;
      }
      .saved-item .content p {
        margin: 0.14rem 0;
        font-size: 0.83rem;
      }
      .saved-item .content h3 {
        margin: 0 0 0.22rem;
        font-size: 1rem;
        line-height: 1.2;
      }
      .saved-item button {
        border: 1px solid #fb7185;
        background: rgba(251, 113, 133, 0.15);
        color: #fb7185;
        border-radius: 8px;
        cursor: pointer;
        padding: 0.32rem 0.55rem;
        font-size: 0.78rem;
        min-width: 56px;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }
      .saved-item button:hover {
        background: rgba(251, 113, 133, 0.35);
        transform: scale(1.04);
      }
      .saved-item img {
        width: 100%;
        border-radius: 8px;
        object-fit: cover;
        border: 1px solid #94a3b8;
      }
      .saved-item .content {
        color: #e5e7eb;
      }
      .saved-item button {
        border: 1px solid #fb7185;
        background: rgba(251, 113, 133, 0.2);
        color: #fb7185;
        border-radius: 10px;
        cursor: pointer;
        padding: 0.5rem 0.8rem;
      }
      .saved-item button:hover {
        background: rgba(251, 113, 133, 0.35);
      }
      .empty {
        text-align: center;
        color: #94a3b8;
      }
      @media (max-width: 700px) {
        .saved-item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="saved-page">
      <section class="saved-card">
        <a href="API.html" class="home-link">⟵ Back to Country API</a>
        <h1>Saved Countries</h1>
        <p class="subtitle">
          Save and recall your favorite country info anytime.
        </p>
        <div class="saved-controls">
          <span id="savedCount">0 saved</span>
          <button id="clearAllBtn" type="button" disabled>Clear All</button>
        </div>
        <p
          id="messageBox"
          class="message"
          aria-live="polite"
          style="display: none"
        ></p>
        <div id="savedItems" class="saved-items"></div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "savedCountries";
      const savedItemsEl = document.getElementById("savedItems");
      const savedCountEl = document.getElementById("savedCount");
      const clearAllBtn = document.getElementById("clearAllBtn");
      const messageBox = document.getElementById("messageBox");

      function getSavedCountries() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch {
          return [];
        }
      }

      function saveInStorage(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function showMessage(text, duration = 2500) {
        messageBox.textContent = text;
        messageBox.style.display = "block";
        clearTimeout(showMessage._timeout);
        showMessage._timeout = setTimeout(() => {
          messageBox.style.display = "none";
        }, duration);
      }

      function updateControls(saved) {
        const total = saved.length;
        savedCountEl.textContent = `${total} saved`;
        clearAllBtn.disabled = total === 0;
      }

      function renderSavedCountries() {
        const saved = getSavedCountries();
        updateControls(saved);

        if (!saved.length) {
          savedItemsEl.innerHTML =
            '<p class="empty">No saved items yet. Go back and save a country.</p>';
          return;
        }

        savedItemsEl.innerHTML = saved
          .map((country) => {
            const regionInfo = country.subregion
              ? `${country.region} • ${country.subregion}`
              : country.region || "Unknown region";

            return `
              <article class="saved-item" data-id="${country.id}">
                <img src="${country.flag || "https://via.placeholder.com/100"}" alt="Flag of ${country.name}" />
                <div class="content">
                  <h3>${country.name}</h3>
                  <p><strong>Official:</strong> ${country.officialName || "-"}</p>
                  <p><strong>Capital:</strong> ${country.capital || "Unknown"}</p>
                  <p><strong>Region:</strong> ${regionInfo}</p>
                  <p><strong>Population:</strong> ${country.population ? Number(country.population).toLocaleString() : "Unknown"}</p>
                  <p><strong>Area:</strong> ${country.area ? Number(country.area).toLocaleString() + " km²" : "Unknown"}</p>
                  <p><strong>Currencies:</strong> ${country.currencies || "Unknown"}</p>
                  <p><strong>Languages:</strong> ${country.languages || "Unknown"}</p>
                </div>
                <button type="button" class="remove-btn" data-id="${country.id}">Remove</button>
              </article>
            `;
          })
          .join("");

        document.querySelectorAll(".remove-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            const id = this.dataset.id;
            const updated = getSavedCountries().filter(
              (item) => item.id !== id,
            );
            saveInStorage(updated);
            showMessage("Item removed successfully.");
            renderSavedCountries();
          });
        });
      }

      clearAllBtn.addEventListener("click", function () {
        if (!confirm("Delete all saved countries?")) {
          return;
        }
        saveInStorage([]);
        showMessage("All saved countries cleared.");
        renderSavedCountries();
      });

      renderSavedCountries();
    </script>
  </body>
</html>
